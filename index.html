<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oliver Chang | Index</title>

    <script>
        (function() {
            const savedTheme = localStorage.getItem('engineering-theme');
            const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

            if (savedTheme === 'dark' || (!savedTheme && systemPrefersDark)) {
                document.documentElement.classList.add('dark-mode');
                document.body.classList.add('dark-mode');
            }
        })();
    </script>

    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/typography.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/pages.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        body.index-page header {
            display: none;
        }

        /* --- DOODLE STYLES --- */
        .hidden-doodle {
            position: fixed;
            width: 300px;
            opacity: 0;
            z-index: 1;
            pointer-events: none;
            transition: opacity 0.15s ease-out;
        }

        /* Bottom Right Positioning */
        .hidden-doodle.br {
            bottom: 40px;
            right: 40px;
            transform: rotate(-10deg);
        }

        /* Top Right Positioning */
        .hidden-doodle.tr {
            top: 40px;
            right: 40px;
            transform: rotate(15deg);
        }
    </style>
</head>

<body class="index-page">

<div class="grid-background-container">
    <div class="grid-pattern grid-base"></div>
    <div class="grid-pattern grid-highlight"></div>
</div>

<div class="container">
    <section>
        <div class="index-body">
            <h6>Oliver Chang</h6>
            <p><i class="fas fa-map-marker-alt"></i> Berkeley, CA</p>

            <div class="role-typing">
                <span class="text role-first-text"> I'm a </span>
                <span class="text role-sec-text"></span>
            </div>

            <div class="index-buttons">
                <a href="about.html"> <button>About Me</button> </a>
                <a href="projects.html"> <button>Projects</button> </a>
                <a href="resume.html"> <button>Resume</button> </a>
            </div>
        </div>
    </section>
</div>

<img id="corner-doodle-br" src="Logos/Doodles/receiptraccoon-doodle.png" alt="Raccoon Doodle" class="hidden-doodle br">
<img id="corner-doodle-tr" src="Logos/Doodles/rocketrecovery-doodle.png" alt="Rocket Doodle" class="hidden-doodle tr">

<div id="scroll-detect" style="height: 100vh;"></div>

<script src="Javascript/lettering.js"></script>
<script src="Javascript/navbar.js"></script>

<script>
    document.addEventListener('mousemove', (e) => {
        const doodles = document.querySelectorAll('.hidden-doodle');
        const revealRadius = 250;

        doodles.forEach(doodle => {
            const rect = doodle.getBoundingClientRect();
            // Calculate center of the doodle
            const doodleX = rect.left + rect.width / 2;
            const doodleY = rect.top + rect.height / 2;

            // Distance formula
            const dist = Math.hypot(e.clientX - doodleX, e.clientY - doodleY);

            if (dist < revealRadius) {
                // Invert distance to get opacity (closer = 1, edge of radius = 0)
                const opacity = 1 - (dist / revealRadius);
                doodle.style.opacity = Math.max(0, opacity);
            } else {
                doodle.style.opacity = 0;
            }
        });
    });
</script>

</body>
</html>
