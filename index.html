<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Index</title>
    <script>
        (function() {
            const savedTheme = localStorage.getItem('engineering-theme');
            const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

            if (savedTheme === 'dark' || (!savedTheme && systemPrefersDark)) {
                document.documentElement.classList.add('dark-mode');
                document.body.classList.add('dark-mode');
            }
        })();
    </script>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        body.index-page header {
            display: none;
        }

        /* --- NEW CSS FOR DOODLE --- */
        .hidden-doodle {
            position: fixed;
            bottom: 40px;  /* Moved up slightly */
            right: 40px;   /* Moved left slightly */
            width: 120px;  /* Adjust size as needed */
            opacity: 0;
            z-index: 1;
            pointer-events: none;
            transition: opacity 0.15s ease-out;
            /* Optional: Rotates it slightly for a handwritten feel */
            transform: rotate(-10deg);
        }
    </style>
</head>

<body class="index-page">

<div class="grid-background-container">
    <div class="grid-pattern grid-base"></div>
    <div class="grid-pattern grid-highlight"></div>
</div>

<div class="container">
    <section>
        <div class="index-body">
            <h6>Oliver Chang</h6>
            <p><i class="fas fa-map-marker-alt"></i> Berkeley, CA</p>

            <div class="role-typing">
                <span class="text role-first-text"> I'm a </span>
                <span class="text role-sec-text"></span>
            </div>

            <div class="index-buttons">
                <a href="about.html"> <button>About Me</button> </a>
                <a href="projects.html"> <button>Projects</button> </a>
                <a href="resume.html"> <button>Resume</button> </a>
            </div>
        </div>
    </section>
</div>

<img id="corner-doodle" src="Logos/receiptraccoon_tp.png" alt="Hidden Doodle" class="hidden-doodle">

<div id="scroll-detect" style="height: 100vh;"></div>

<script src="Javascript/lettering.js"></script>
<script src="Javascript/navbar.js"></script>

<script>
    document.addEventListener('mousemove', (e) => {
        const doodle = document.getElementById('corner-doodle');
        if (!doodle) return;

        const rect = doodle.getBoundingClientRect();
        const doodleX = rect.left + rect.width / 2;
        const doodleY = rect.top + rect.height / 2;

        const dist = Math.hypot(e.clientX - doodleX, e.clientY - doodleY);

        // You can adjust this number to make the reveal area larger or smaller
        const revealRadius = 250;

        if (dist < revealRadius) {
            // Calculate opacity: 0 at the edge of radius, 1 at the center
            const opacity = 1 - (dist / revealRadius);
            doodle.style.opacity = Math.max(0, opacity); // Ensure it doesn't go below 0
        } else {
            doodle.style.opacity = 0;
        }
    });
</script>

</body>
</html>
