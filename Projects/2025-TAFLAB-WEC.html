<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>2025 | Wave Energy Converter</title>
    <script>
        (function() {
            const savedTheme = localStorage.getItem('engineering-theme');
            const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

            if (savedTheme === 'dark' || (!savedTheme && systemPrefersDark)) {
                document.documentElement.classList.add('dark-mode');
                document.body.classList.add('dark-mode');
            }
        })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../styles.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body>

<div class="container">
    <div class="info-summery">
        <h7 class="info-title">Wave Energy Converter (WEC)</h7>
        <h3>2025 | Theoretical & Applied Fluid Dynamics Laboratory (TAFLAB) </h3>
    </div>

    <div class="info-banner-image-container">
        <img class="info-banner-image" src="../Images/project-2025-taflab/TAFLAB-CAD.webp" alt="WEC CAD Model">
    </div>

    <p>Harnessing the ocean's energy, one swing at a time, using a oscillating pendulum at the bottom of the boat's keel.</p>

    <div class="info-at-a-glance">
        <div class="info-glance-section">
            <p class="text-mini">ROLE</p>
            <p class="text-mini">Design & Manufacturing Engineer</p>
        </div>
        <div class="info-glance-section">
            <p class="text-mini">TOOLS</p>
            <img class="info-tool-logo" src="../Logos/onshape.webp" alt="Onshape">
            <img class="info-tool-logo" src="../Logos/fusion360.webp" alt="Fusion 360">
            <img class="info-tool-logo" src="../Logos/arduino.webp" alt="Arduino">
            <img class="info-tool-logo" src="../Logos/python.webp" alt="Python">
            <img class="info-tool-logo" src="../Logos/etch.webp" alt="Etch">
        </div>
    </div>

    <div class="info-highlight">
        <h2>Modeling</h2>
        <div class="slides-container">
            <iframe
                    src="https://docs.google.com/presentation/d/1dtCPmzqyA0uf_qpQnZrvUk1EbVuBBhJS9iaCWjTAcSE/embed?start=false&loop=false&delayms=3000"
                    allowfullscreen
                    mozallowfullscreen="true"
                    webkitallowfullscreen="true">
            </iframe>
        </div>
    </div>

    <div class="info-highlight">
        <h2>Damping</h2>
        <div class="slides-container">
            <iframe
                    src="https://docs.google.com/presentation/d/1J4RDB7_8tmMaOuCwHy-bQHVvegGwH7EavXhR8SZglgg/embed?start=false&loop=false&delayms=3000"
                    allowfullscreen
                    mozallowfullscreen="true"
                    webkitallowfullscreen="true">
            </iframe>
        </div>
    </div>

    <div class="info-highlight">
        <h2>October Progress Update</h2>
        <div class="slides-container">
            <iframe
                    src="https://docs.google.com/presentation/d/1J4RDB7_8tmMaOuCwHy-bQHVvegGwH7EavXhR8SZglgg/embed?start=false&loop=false&delayms=3000"
                    allowfullscreen
                    mozallowfullscreen="true"
                    webkitallowfullscreen="true">
            </iframe>
        </div>
    </div>
</div>

<script src="../navbar.js"></script>

<script>
    document.querySelectorAll('.before-after-container').forEach(container => {
        const before = container.querySelector('.before');
        const slider = container.querySelector('.slider');

        let isDragging = false;

        const moveSlider = (x) => {
            const rect = container.getBoundingClientRect();
            let offsetX = x - rect.left;
            offsetX = Math.max(0, Math.min(offsetX, rect.width));
            const percent = (offsetX / rect.width) * 100;
            before.style.width = percent + "%";
            slider.style.left = percent + "%";
        };

        slider.addEventListener('mousedown', () => isDragging = true);
        window.addEventListener('mouseup', () => isDragging = false);
        window.addEventListener('mousemove', e => {
            if (isDragging) moveSlider(e.clientX);
        });

        // Mobile Touch Support
        slider.addEventListener('touchstart', () => isDragging = true);
        window.addEventListener('touchend', () => isDragging = false);
        window.addEventListener('touchmove', e => {
            if (isDragging) moveSlider(e.touches[0].clientX);
        });
    });
</script>

</body>
</html>
